name: verify-release

# Weekly check that the newest release assets are still downloadable and that
# the published digests match. Catches deleted assets, corrupted re-uploads and
# accidental tag edits.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify (defaults to the latest release)
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D "$tmp" -p SHA256SUMS
          ( cd "$tmp" && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.apk' -D "$tmp" )
          ( cd "$tmp" && sha256sum -c SHA256SUMS )
